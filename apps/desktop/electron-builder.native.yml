appId: ai.nori.desktop
productName: N.O.R.I.
executableName: Nori
asar: true
electronVersion: 44.4.5
electronDist: ../../runtime/electron/v44.4.5
directories:
  output: release/native-desktop-current
files:
  - dist/**/*
  - desktop/**/*
  - bridge/**/*
  - public/nori-icon.ico
  - public/nori-icon.png
  - public/icons/nori-spin-minute/**/*
  - package.json
  - "!node_modules/@anthropic-ai/**/*"
  - "!bridge/{chrome,panels,ui,vision}.mjs"
extraResources:
  - from: release/native-suite-current/NoriSuite
    to: NoriSuite
    filter:
      - "**/*"
      - "!state{,/**/*}"
      - "!verification{,/**/*}"
      - "!**/__pycache__{,/**/*}"
      - "!**/*.pyc"
      - "!native-payload-receipt.json"
win:
  target: dir
  icon: public/nori-icon.ico
  signAndEditExecutable: false
