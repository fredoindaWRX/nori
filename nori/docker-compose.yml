name: nori-round-table
services:
  chromadb:
    image: chromadb/chroma:1.1.1
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["chroma-data:/data"]
    restart: unless-stopped
  tailscale:
    profiles: [remote]
    image: tailscale/tailscale:stable
    hostname: nori-round-table
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
    volumes: ["tailscale-data:/var/lib/tailscale"]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "32"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    restart: unless-stopped
  letta:
    image: letta/letta@sha256:592900fbd91a5e06916de2731cfd27cf3d925556f2819d9b5dcb548245e3646f
    command: ["letta", "server", "--backend", "local", "--listen", "ws://0.0.0.0:4500", "--ws-auth", "capability-token", "--ws-token-file", "/run/secrets/letta_token"]
    ports: ["127.0.0.1:8283:4500"]
    volumes: ["letta-app-state:/root/.letta", "letta-workspace:/workspace"]
    secrets: [letta_token]
    restart: unless-stopped
  localai:
    profiles: [localai]
    image: localai/localai:latest-cpu
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["localai-data:/models"]
    restart: unless-stopped
  council:
    profiles: [council]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NORI_BIND: 0.0.0.0
      OLLAMA_URL: http://host.docker.internal:11434
      NORI_LETTA_BASE: http://letta:4500
      NORI_LETTA_TOKEN_FILE: /run/secrets/letta_token
      NORI_API_TOKEN: ${NORI_API_TOKEN:?Set NORI_API_TOKEN in your environment}
    ports: ["127.0.0.1:9101-9112:9101-9112"]
    volumes: ["council-data:/data"]
    secrets: [letta_token]
    depends_on: [letta, chromadb]
    restart: unless-stopped

volumes:
  council-data:
  letta-app-state:
  letta-workspace:
  chroma-data:
  tailscale-data:
  ollama-data:
  letta-data:
  localai-data:
  neo-data:
  trinity-data:
  morpheus-data:
  apoc-data:
  oracle-data:
  merovingian-data:
  architect-data:
  keymaker-data:
  smith-data:
  tank-data:
  machine-data:
  sentinel-data:

secrets:
  letta_token:
    file: ./runtime-data/secrets/letta-token
